# docker compose up                      -> API + web page on :8000 (docs at /docs) and a local S3-compatible store on :9000, SQLite state in a volume
# docker compose --profile test run --rm tests   -> ALL tests with no API keys: unit + integration (HTTP) + render e2e + scripted sessions
#
# The S3 store is `moto` (Apache-2.0) running from OUR image, so there is no third-party image to disappear
# (the public minio/minio image was removed from Docker Hub). It keeps files in memory: fine for local runs and demos.
# For real storage point S3_ENDPOINT / keys at any S3-compatible service (AWS S3, Cloudflare R2, Garage, ...).
services:
  s3:
    build: .
    command: python -m moto.server -H 0.0.0.0 -p 9000
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/moto-api/')"]
      interval: 5s
      retries: 12

  api:
    build: .
    depends_on:
      s3: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["state:/data"]
    environment:
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      API_TOKEN: ${API_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      TRANSCRIBER: ${TRANSCRIBER:-auto}
      NLU: ${NLU:-rules}
      LLM_API_KEY: ${LLM_API_KEY:-}
      STORAGE: s3
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-incubrix-editor}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-secret}
      CALLBACK_SECRET: ${CALLBACK_SECRET:-change-me}
      FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

  tests:
    build: .
    profiles: ["test"]
    environment: {JOBS_INLINE: "1", RATE_LIMIT_PER_MIN: "0", DATA_DIR: /tmp/data}
    command: >
      sh -c "python -m tools.fixtures fixtures && python -m tools.make_sessions
      && pytest -q -p no:cacheprovider
      && python -m app.runner sessions -o /tmp/results"

volumes: {state: {}}
