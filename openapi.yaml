openapi: 3.1.0
info:
  title: IncuBrix Prompt-Based Video Editing Engine
  description: Edit a video by typing. Edits attach to content (word ids), never to
    clock positions.
  version: 1.0.0
paths:
  /api/v1/samples:
    get:
      summary: Built-in sample videos for trying the editor
      operationId: list_samples_api_v1_samples_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/samples/{name}:
    post:
      summary: Load a built-in sample video (starts an ingest job)
      operationId: load_sample_api_v1_samples__name__post
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/ready:
    get:
      summary: Ready
      operationId: ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/videos:
    post:
      summary: Upload (multipart `file`) or give a URL (JSON `url`); starts an ingest
        job
      operationId: create_video_api_v1_videos_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/videos/{vid}:
    get:
      summary: Get Video
      operationId: get_video_api_v1_videos__vid__get
      parameters:
      - name: vid
        in: path
        required: true
        schema:
          type: string
          title: Vid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/videos/{vid}/source:
    get:
      summary: The original, untouched video file
      operationId: get_source_api_v1_videos__vid__source_get
      parameters:
      - name: vid
        in: path
        required: true
        schema:
          type: string
          title: Vid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/videos/{vid}/transcript:
    get:
      summary: Get Transcript
      operationId: get_transcript_api_v1_videos__vid__transcript_get
      parameters:
      - name: vid
        in: path
        required: true
        schema:
          type: string
          title: Vid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions:
    post:
      summary: Create Session
      operationId: create_session_api_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{sid}:
    get:
      summary: Get Session
      operationId: get_session_api_v1_sessions__sid__get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{sid}/timeline:
    get:
      summary: Get Timeline
      operationId: get_timeline_api_v1_sessions__sid__timeline_get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: json
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{sid}/instructions:
    post:
      summary: Send one plain-language instruction
      operationId: instruct_api_v1_sessions__sid__instructions_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SayIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{sid}/answer:
    post:
      summary: Answer the pending clarification question
      operationId: answer_api_v1_sessions__sid__answer_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{sid}/render:
    post:
      summary: Render
      operationId: render_api_v1_sessions__sid__render_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RenderIn'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/timeline-schema:
    get:
      summary: Tl Schema
      operationId: tl_schema_api_v1_timeline_schema_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AnswerIn:
      properties:
        answer:
          type: string
          title: Answer
      type: object
      required:
      - answer
      title: AnswerIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RenderIn:
      properties:
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: RenderIn
    SayIn:
      properties:
        say:
          type: string
          title: Say
      type: object
      required:
      - say
      title: SayIn
    SessionIn:
      properties:
        video_id:
          type: string
          title: Video Id
      type: object
      required:
      - video_id
      title: SessionIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
